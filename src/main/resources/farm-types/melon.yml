# Melon Farm — stem-fruit farm. Melon and pumpkin blocks are harvested,
# stems are left to grow the next one.
id: melon
display-name: "<yellow>Melon Farm</yellow>"
description: "Harvests melon and pumpkin blocks; stems keep producing."
core-block: COMPOSTER
item:
  material: MELON_SEEDS
  name: "<yellow>Melon Farm</yellow>"
  lore:
    - "<gray>Place to create an automated melon/pumpkin farm.</gray>"
    - "<gray>Plant stems inside the radius — fruit blocks are</gray>"
    - "<gray>harvested, stems keep producing.</gray>"
    - "<gray>Radius <white>{radius}</white> | Tick <white>{interval}s</white></gray>"
    - "<yellow>Right-click the placed farm to manage it.</yellow>"

# Shop entry for /farm shop.
shop:
  enabled: true
  category: Fruit
  price-money: 3000.0
  price-xp-levels: 12
farm:
  base-radius: 4
  tick-interval: 140
  growth-attempts: 8
  age-per-sample: 1
  harvest-sweep: true
  max-harvests-per-tick: 16
  till-attempts: 8
effects:
  harvest-particle: HAPPY_VILLAGER
  harvest-particle-count: 8
  harvest-sound: BLOCK_CROP_BREAK
  harvest-sound-volume: 0.6
  harvest-sound-pitch: 1.0
  working-particle: GLOW
  working-particle-count: 6
storage:
  base-slots: 27
fuel:
  items: [COAL, CHARCOAL]
  ticks-per-item: 1200
harvest:
  melon:
    material: MELON
    behavior: STEM_FRUIT
  pumpkin:
    material: PUMPKIN
    behavior: STEM_FRUIT
trees:
  enabled: false
offline:
  max-hours: 12
hologram:
  enabled: true
  lines:
    - "<yellow><bold>Melon Farm</bold></yellow>"
    - "<gray>{owner}</gray>"
    - "<yellow>Fuel {fuel_percent}%</yellow> <dark_gray>|</dark_gray> <aqua>{storage_used}/{storage_slots}</aqua>"
upgrades:
  radius:
    levels:
      - { effect: 6, cost-money: 500.0, description: "Radius 6" }
      - { effect: 8, cost-money: 1500.0, description: "Radius 8" }
      - { effect: 11, cost-money: 5000.0, description: "Radius 11" }
  speed:
    levels:
      - { effect: 100, cost-money: 500.0, description: "Tick every 5s" }
      - { effect: 70, cost-money: 1800.0, description: "Tick every 3.5s" }
      - { effect: 40, cost-money: 6000.0, description: "Tick every 2s" }
  storage:
    levels:
      - { effect: 36, cost-money: 300.0, description: "36 slots" }
      - { effect: 54, cost-money: 1200.0, description: "54 slots" }
  efficiency:
    levels:
      - { effect: 1.25, cost-money: 400.0, description: "+25% fuel life" }
      - { effect: 2.0, cost-money: 2500.0, description: "+100% fuel life" }
  tilling:
    levels:
      - { effect: 1, cost-money: 2000.0, description: "Auto-plow soil" }
      - { effect: 2, cost-money: 6000.0, description: "Auto-plow + hydrate farmland" }
